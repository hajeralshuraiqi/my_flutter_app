name: Flutter CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: فحص وبناء التطبيق
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: تثبيت الاعتماديات
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze

      - name: تشغيل الاختبارات
        run: flutter test

      - name: بناء APK
        run: flutter build apk --release

      - name: حفظ ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk